apiVersion: 1

datasources:
  - name: Ligue1-Postgres
    uid: farmer-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}

  - name: Prometheus
    uid: farmer-prom
    type: prometheus
    url: http://prometheus:9090
